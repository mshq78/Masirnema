    <script>
      (function() {
        try {
          var saved = localStorage.getItem('masirnama_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="antialiased selection:bg-amber-200/50 selection:text-slate-900 font-sans">
